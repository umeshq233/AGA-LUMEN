<!-- Floating WhatsApp Chat Button -->
<script>
  window.onload = function () {
    var chatButton = document.createElement("a");
    chatButton.href = "https://wa.me/919999567382";
    chatButton.target = "_blank";
    chatButton.style.position = "fixed";
    chatButton.style.bottom = "20px";
    chatButton.style.right = "20px";
    chatButton.style.background = "#25D366";
    chatButton.style.color = "white";
    chatButton.style.padding = "12px 18px";
    chatButton.style.borderRadius = "50px";
    chatButton.style.boxShadow = "0 2px 6px rgba(0,0,0,0.3)";
    chatButton.style.fontWeight = "bold";
    chatButton.style.fontFamily = "Arial, sans-serif";
    chatButton.style.zIndex = "9999";
    chatButton.innerText = "💬 Customer Support";
    document.body.appendChild(chatButton);
  };
</script>
